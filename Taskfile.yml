version: "3"

dotenv: [".env"]

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  setup:
    desc: Install deps and set up the database (deps.get + ecto.create + ecto.migrate)
    cmds:
      - mix setup

  start:
    desc: Run dev poller detached (nohup, survives terminal close)
    cmds:
      - mix setup
      - mkdir -p logs priv/data
      - |
        if [ -f priv/data/marketmailer.pid ]; then
          PID=$(cat priv/data/marketmailer.pid)
          if /bin/kill -0 "$PID" 2>/dev/null; then
            echo "poller already running — nothing to do (pid $PID, logs/poller.log)"
            exit 0
          fi
          rm -f priv/data/marketmailer.pid
        fi
        # Fallback: live node without a pidfile (predates pidfile logic).
        # NOTE: `pgrep -f` scans full command lines, and this script's own
        # text contains the pattern — as does every go-task wrapper shell
        # above us — so exclude this shell AND all its ancestors. A bare
        # `pgrep -f "[m]arketmailer"` (or filtering only $$) always matches
        # itself and is useless here.
        drop="^$$\$"
        _p=$PPID
        while [ -n "$_p" ] && [ "$_p" != "1" ]; do
          drop="$drop|^${_p}\$"
          _p=$(ps -o ppid= -p "$_p" 2>/dev/null | tr -d '[:space:]') || break
        done
        LIVE=$(pgrep -f "sname marketmailer" | grep -Ev "$drop" | head -n 1 || true)
        if [ -n "$LIVE" ]; then
          echo "$LIVE" > priv/data/marketmailer.pid
          echo "poller already running — nothing to do (pid $LIVE, logs/poller.log)"
          exit 0
        fi
        nohup elixir --sname marketmailer -S mix run --no-halt >> logs/poller.log 2>&1 &
        echo $! > priv/data/marketmailer.pid
        echo "started dev poller pid $(cat priv/data/marketmailer.pid) logs/poller.log"

  start:live:
    desc: Run prod release detached (daemon, survives terminal close)
    cmds:
      - MIX_ENV=prod mix release
      - |
        # See `start` for why this shell and all its ancestors must be
        # excluded from pgrep -f results.
        drop="^$$\$"
        _p=$PPID
        while [ -n "$_p" ] && [ "$_p" != "1" ]; do
          drop="$drop|^${_p}\$"
          _p=$(ps -o ppid= -p "$_p" 2>/dev/null | tr -d '[:space:]') || break
        done
        if pgrep -f "prod/rel/marketmailer" | grep -Ev "$drop" > /dev/null; then
          echo "prod release already running — nothing to do"
          exit 0
        fi
        if [ -f priv/data/marketmailer.pid ]; then
          PID=$(cat priv/data/marketmailer.pid)
          if /bin/kill -0 "$PID" 2>/dev/null; then
            echo "dev poller already running — nothing to do (pid $PID); stop it first"
            exit 0
          fi
          rm -f priv/data/marketmailer.pid
        fi
        LIVE=$(pgrep -f "sname marketmailer" | grep -Ev "$drop" | head -n 1 || true)
        if [ -n "$LIVE" ]; then
          echo "$LIVE" > priv/data/marketmailer.pid
          echo "dev poller already running — nothing to do (pid $LIVE); stop it first"
          exit 0
        fi
        _build/prod/rel/marketmailer/bin/marketmailer daemon
        echo "started prod release (daemon)"

  stop:
    desc: Stop the dev poller (kill nohup via pidfile)
    cmds:
      - |
        if [ -f priv/data/marketmailer.pid ]; then
          PID=$(cat priv/data/marketmailer.pid)
          if /bin/kill -0 "$PID" 2>/dev/null; then
            /bin/kill "$PID"
            rm -f priv/data/marketmailer.pid
            echo "stopped dev poller pid $PID"
            exit 0
          fi
          rm -f priv/data/marketmailer.pid
        fi
        # Fallback: live node without a pidfile. See `start` for why this
        # shell and all its ancestors must be excluded from pgrep results.
        drop="^$$\$"
        _p=$PPID
        while [ -n "$_p" ] && [ "$_p" != "1" ]; do
          drop="$drop|^${_p}\$"
          _p=$(ps -o ppid= -p "$_p" 2>/dev/null | tr -d '[:space:]') || break
        done
        LIVE=$(pgrep -f "sname marketmailer" | grep -Ev "$drop" | head -n 1 || true)
        if [ -z "$LIVE" ]; then
          echo "poller not running — nothing to do"
          exit 0
        fi
        /bin/kill "$LIVE"
        echo "stopped dev poller pid $LIVE"

  stop:live:
    desc: Stop the prod release daemon
    cmds:
      - |
        # Match only release beams (bundled erts under prod/rel), never the
        # dev `mix run` poller — both are named `marketmailer`. See `start`
        # for why this shell and all its ancestors must be excluded.
        drop="^$$\$"
        _p=$PPID
        while [ -n "$_p" ] && [ "$_p" != "1" ]; do
          drop="$drop|^${_p}\$"
          _p=$(ps -o ppid= -p "$_p" 2>/dev/null | tr -d '[:space:]') || break
        done
        LIVE=$(pgrep -f "prod/rel/marketmailer" | grep -Ev "$drop" | head -n 1 || true)
        if [ -z "$LIVE" ]; then
          echo "prod release not running — nothing to do"
          exit 0
        fi
        BIN=_build/prod/rel/marketmailer/bin/marketmailer
        if [ -x "$BIN" ]; then
          "$BIN" stop
        else
          /bin/kill "$LIVE"
        fi
        echo "stopped prod release (was pid $LIVE)"

  live:update:
    desc: Hot-upgrade the running deployment without restart (auto VSN from mix.exs)
    cmds:
      - MIX_ENV=prod mix release
      - mkdir -p artifacts
      - cp _build/prod/marketmailer-*.tar.gz artifacts/
      - ls artifacts/
      - |
        VSN=$(sed -n 's/^[[:space:]]*version:[[:space:]]*"\(.*\)".*/\1/p' mix.exs | head -n 1)
        test -n "$VSN" || (echo "could not read version from mix.exs" && exit 1)
        echo "hot-upgrading to $VSN"
        _build/prod/rel/marketmailer/bin/castle unpack "$VSN"
        _build/prod/rel/marketmailer/bin/castle install "$VSN"
        _build/prod/rel/marketmailer/bin/castle commit

  dev:
    desc: Interactive shell with the app started
    cmds:
      - iex -S mix run
    interactive: true

  compile:
    desc: Compile the project
    cmds:
      - mix compile

  compile:strict:
    desc: Compile with warnings as errors
    cmds:
      - mix compile --warnings-as-errors

  format:
    desc: Check formatting (does not write)
    cmds:
      - mix format

  format:write:
    desc: Write formatting in place
    cmds:
      - mix format --no-check-formatted

  migrate:
    desc: Run pending Ecto migrations
    cmds:
      - mix ecto.migrate

  rollback:
    desc: Roll back the last Ecto migration
    cmds:
      - mix ecto.rollback

  chartdb:
    desc: Rebuild assets/schema.svg from migrations (temp DB; live poller untouched) + ensure README embed
    cmds:
      - mix chartdb

  test:
    desc: Run the test suite
    cmds:
      - mix test

  test:safe:
    desc: Test in MIX_ENV=test alongside a live poller when DB-isolated (stubbed ESI, priv/data/test.db)
    cmds:
      - mix test.safe

  release:
    desc: Assemble the prod OTP release with Castle hot-upgrade support
    cmds:
      - MIX_ENV=prod mix release

  update:
    desc: Update all dependencies to latest allowed versions (mix deps.update --all)
    cmds:
      - mix deps.update --all

  update:hex:
    desc: Update Hex and Rebar themselves (mix local.hex)
    cmds:
      - mix local.hex --force
      - mix local.rebar --force

  docker:build:
    desc: Build the marketmailer Docker image
    cmds:
      - docker build -t marketmailer .

  docker:run:
    desc: Run the marketmailer Docker image (SQLite volume at marketmailer-data:/data)
    cmds:
      - docker run --rm -p 443:443 -v marketmailer-data:/data -e MARKETMAILER_DB=/data/marketmailer.db marketmailer

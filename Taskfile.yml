version: "3"

dotenv: [".env"]

silent: true

output: prefixed

vars:
  DEV_DB: priv/data/marketmailer.db
  BIN: _build/prod/rel/marketmailer/bin/marketmailer
  CASTLE: _build/prod/rel/marketmailer/bin/castle
  BOLD: "\e[1m"
  DIM: "\e[2m"
  RED: "\e[31m"
  GREEN: "\e[32m"
  YELLOW: "\e[33m"
  BLUE: "\e[34m"
  RESET: "\e[0m"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  install:
    desc: Fetch all dependencies (mix deps.get)
    cmds:
      - mix deps.get

  update:
    desc: Update all dependencies to latest allowed versions (mix deps.update --all)
    cmds:
      - mix deps.update --all

  remove:
    desc: Remove all dependencies and build artifacts (mix deps.clean + mix clean)
    cmds:
      - mix deps.clean --all
      - mix clean

  setup:
    desc: Install deps, migrate the DB and load the SDE name/system caches (idempotent; SDE_BUILD pins a build, default is the latest published)
    deps: [install, playwright:install]
    env:
      SDE_DB: '{{.DEV_DB}}'
    cmds:
      - |
        SDE_DB="${MARKETMAILER_DB:-$SDE_DB}"
        export MARKETMAILER_DB="$SDE_DB" MARKETMAILER_DEV_DB="$SDE_DB"
        mix setup
        mix sde.import ${SDE_BUILD:-}
        echo "{{.GREEN}}setup: done (database $SDE_DB){{.RESET}}"

  playwright:install:
    desc: Install the Chromium build matching the `playwright` CLI on PATH (no-op when current)
    cmds:
      - playwright install chromium

  start:
    desc: Kill every marketmailer process, rebuild the current tree, and start it detached
    cmds:
      - |
        DEV_DB="{{.DEV_DB}}"
        PROD_DB="${MARKETMAILER_DB:-$DEV_DB}"
        EFF_DB="$DEV_DB"
        [ -f "$PROD_DB" ] && EFF_DB="$PROD_DB"
        command -v sqlite3 >/dev/null || { echo "{{.RED}}start: sqlite3 CLI not found — cannot verify SDE load{{.RESET}}" >&2; exit 1; }
        [ -f "$EFF_DB" ] || { echo "{{.RED}}start: $EFF_DB missing — run task setup first (migrate + SDE load){{.RESET}}" >&2; exit 1; }
        if ! n=$(sqlite3 "$EFF_DB" "SELECT MIN(c) FROM (SELECT COUNT(*) c FROM sde_imports UNION ALL SELECT COUNT(*) FROM names UNION ALL SELECT COUNT(*) FROM systems UNION ALL SELECT COUNT(*) FROM regions);" 2>/dev/null) || [ -z "$n" ] || [ "$n" = "0" ]; then
          echo "{{.RED}}start: SDE not loaded in $EFF_DB (sde_imports/names/systems/regions empty or missing) — run task setup first{{.RESET}}" >&2
          exit 1
        fi
        echo "{{.GREEN}}start: SDE caches present in $EFF_DB{{.RESET}}"
      - task: stop
      - MIX_ENV=prod mix compile --force
      - MIX_ENV=prod mix release --overwrite
      - |
        DEV_DB="{{.DEV_DB}}"
        PROD_DB="${MARKETMAILER_DB:-$DEV_DB}"
        if [ "$PROD_DB" != "$DEV_DB" ] && [ ! -f "$PROD_DB" ] && [ -f "$DEV_DB" ]; then
          mkdir -p "$(dirname "$PROD_DB")"
          cp -n "$DEV_DB" "$PROD_DB" 2>/dev/null || true
          cp -n "$DEV_DB-wal" "$PROD_DB-wal" 2>/dev/null || true
          cp -n "$DEV_DB-shm" "$PROD_DB-shm" 2>/dev/null || true
          echo "{{.BLUE}}start: seeded $PROD_DB from $DEV_DB{{.RESET}}"
        fi
      - |
        PROD_DB="$(realpath -m "${MARKETMAILER_DB:-{{.DEV_DB}}}")"
        rm -f priv/data/marketmailer.pid
        mkdir -p logs
        MARKETMAILER_DB="$PROD_DB" ERL_CRASH_DUMP="$PWD/logs/erl_crash.dump" RUN_ERL_LOG_MAXSIZE=10485760 {{.BIN}} daemon
        echo "{{.GREEN}}started prod release (daemon, database $PROD_DB){{.RESET}}"

  stop:
    desc: Kill every marketmailer process on this host
    cmds:
      - |
        BIN={{.BIN}}
        sweep() {
          {
            pgrep -f "$PWD/_build/(prod/rel/marketmailer/.*/(beam\.smp|run_erl|erl|inet_gethost)|dev/)" 2>/dev/null || true
            for pid in $(pgrep -f "(^|[ /])(mix (run|start)|iex)( |$)" 2>/dev/null || true); do
              case "$(cat "/proc/$pid/comm" 2>/dev/null || true)" in
                beam.smp|beam|erl) ;;
                *) continue ;;
              esac
              cwd=$(readlink "/proc/$pid/cwd" 2>/dev/null || true)
              case "$cwd" in
                "$PWD"|"$PWD"/*) echo "$pid" ;;
              esac
            done
          } | grep -v -e "^$$$" -e "^$PPID$" | sort -u || true
        }
        [ -x "$BIN" ] && "$BIN" pid >/dev/null 2>&1 && { echo "{{.BLUE}}stop: asked prod release to stop (was pid $("$BIN" pid 2>/dev/null || echo unknown)){{.RESET}}"; "$BIN" stop >/dev/null 2>&1 || true; }
        pids=$(sweep)
        if [ -n "$pids" ]; then
          echo "{{.YELLOW}}stop: terminating leftovers: $(echo $pids | tr '\n' ' '){{.RESET}}"
          /bin/kill $pids 2>/dev/null || true
          for _ in $(seq 1 20); do
            pids=$(sweep)
            [ -z "$pids" ] && break
            sleep 0.5
          done
          if [ -n "$pids" ]; then
            echo "{{.YELLOW}}stop: killing stubborn leftovers: $(echo $pids | tr '\n' ' '){{.RESET}}"
            /bin/kill -9 $pids 2>/dev/null || true
          fi
        fi
        rm -f priv/data/marketmailer.pid

  live:update:
    desc: Hot-upgrade the running prod in two phases (prepare writes bump+appup, you commit, re-run applies on a clean tree); refuses when nothing runs or the tree is dirty, and never leaves the daemon down
    cmds:
      - |
        VSN=$(sed -n 's/^[[:space:]]*version:[[:space:]]*"\(.*\)".*/\1/p' mix.exs | head -n 1)
        test -n "$VSN" || { echo "{{.RED}}live:update: could not read version from mix.exs{{.RESET}}" >&2; exit 1; }
        BIN={{.BIN}}
        CASTLE={{.CASTLE}}
        ALL_TARS=$(ls releases/marketmailer-*.tar.gz 2>/dev/null | sort -V || true)
        T0=$SECONDS
        stamp() { echo "{{.DIM}}live:update: [$((SECONDS - T0))s] $1{{.RESET}}"; }
        DIRTY=$(git status --porcelain || true)
        if ! { [ -x "$BIN" ] && "$BIN" pid >/dev/null 2>&1; }; then
          echo "{{.RED}}live:update: no living prod process to update — run task start{{.RESET}}" >&2
          exit 1
        fi
        if [ -n "$DIRTY" ]; then
          echo "{{.RED}}live:update: uncommitted changes — commit everything first:{{.RESET}}" >&2
          echo "$DIRTY" | head -n 20
          exit 1
        fi
        ensure_up() {
          up() {
            "$BIN" pid >/dev/null 2>&1 || return 1
            "$BIN" rpc 'IO.puts(Process.whereis(Marketmailer.Supervisor) != nil)' 2>/dev/null | grep -q '^true$'
          }
          live=0
          for _ in $(seq 1 30); do
            if up; then live=1; break; fi
            sleep 1
          done
          if [ "$live" != "1" ]; then
            echo "{{.YELLOW}}live:update: daemon is down — restarting on $VSN{{.RESET}}"
            task stop >/dev/null 2>&1 || true
            "$BIN" daemon || { echo "{{.RED}}live:update: could not restart the daemon — run task start{{.RESET}}" >&2; return 1; }
            live=0
            for _ in $(seq 1 30); do
              if up; then live=1; break; fi
              sleep 1
            done
          fi
          if [ "$live" != "1" ]; then
            echo "{{.RED}}live:update: daemon did not come back up — run task start{{.RESET}}" >&2
            return 1
          fi
          RUN_NOW=$("$BIN" version 2>/dev/null | awk '{print $NF}')
          if [ "$RUN_NOW" != "$VSN" ]; then
            echo "{{.RED}}live:update: daemon is up on $RUN_NOW, expected $VSN — run task start{{.RESET}}" >&2
            return 1
          fi
          return 0
        }
        stage_release() {
          MIX_ENV=prod mix compile --force
          stamp "prod recompile done"
          MIX_ENV=prod mix release --overwrite
          stamp "prod release assembled"
          mkdir -p releases
          cp "_build/prod/marketmailer-$VSN.tar.gz" releases/
          echo "{{.GREEN}}live:update: staged releases/marketmailer-$VSN.tar.gz{{.RESET}}"
        }
        if [ -z "$ALL_TARS" ]; then
          echo "{{.BLUE}}live:update: no shipped baseline — first build, no upgrade path{{.RESET}}"
          stage_release
          ensure_up || exit 1
          exit 0
        fi
        FROM_TAR=""
        for tar in $ALL_TARS; do
          ver=$(basename "$tar" .tar.gz | sed 's/^marketmailer-//')
          if [ "$ver" != "$VSN" ] && [ "$(printf '%s\n%s\n' "$ver" "$VSN" | sort -V | head -n 1)" = "$ver" ]; then
            FROM_TAR="$tar"
          fi
        done
        if [ -z "$FROM_TAR" ]; then
          NEWEST_TAR=$(echo "$ALL_TARS" | tail -n 1)
          NEWEST_VER=$(basename "$NEWEST_TAR" .tar.gz | sed 's/^marketmailer-//')
          if [ "$NEWEST_VER" = "$VSN" ]; then
            FROM_TAR="$NEWEST_TAR"
          else
            echo "{{.BLUE}}live:update: no baseline older than $VSN — building without upgrade path{{.RESET}}"
            stage_release
            ensure_up || exit 1
            exit 0
          fi
        fi
        FROM_VER=$(basename "$FROM_TAR" .tar.gz | sed 's/^marketmailer-//')
        mix compile >/dev/null 2>&1 || { echo "{{.RED}}live:update: compile failed{{.RESET}}" >&2; exit 1; }
        stamp "dev compile ok"
        if mix castle.appup --from "tar:$FROM_TAR" >/dev/null 2>&1; then
          stamp "appup coverage holds for $FROM_VER -> $VSN"
          if [ ! -f "releases/marketmailer-$VSN.tar.gz" ]; then
            echo "{{.BLUE}}live:update: version $VSN not built yet — building (no version change needed){{.RESET}}"
            stage_release
          else
            RUN_VSN=$("$BIN" version 2>/dev/null | awk '{print $NF}' || true)
            if [ "$RUN_VSN" = "$VSN" ]; then
              echo "{{.GREEN}}live:update: no changes (version $VSN matches $FROM_TAR) — nothing to do{{.RESET}}"
              ensure_up || exit 1
              exit 0
            fi
            echo "{{.YELLOW}}live:update: $VSN staged but daemon runs ${RUN_VSN:-unknown} — resuming upgrade{{.RESET}}"
          fi
        else
          echo "{{.YELLOW}}live:update: code differs from $FROM_TAR{{.RESET}}"
          if [ -f "releases/marketmailer-$VSN.tar.gz" ]; then
            NEW_VSN=$(echo "$VSN" | awk -F. '{printf "%s.%s.%d", $1, $2, $3+1}')
            case "$NEW_VSN" in
              *.*.*) ;;
              *) { echo "{{.RED}}live:update: cannot bump version '$VSN'{{.RESET}}" >&2; exit 1; } ;;
            esac
            echo "{{.YELLOW}}live:update: $VSN already shipped — bumping mix.exs to $NEW_VSN{{.RESET}}"
            sed -i "s/^\([[:space:]]*version:[[:space:]]*\)\".*\"/\1\"$NEW_VSN\"/" mix.exs
            VSN="$NEW_VSN"
          fi
          FROM_TAR=$(ls releases/marketmailer-*.tar.gz 2>/dev/null | sort -V | tail -n 1)
          FROM_VER=$(basename "$FROM_TAR" .tar.gz | sed 's/^marketmailer-//')
          TOP_TAG=$(sed -n 's/^  ~c"\(.*\)",$/\1/p' appup.exs | head -n 1)
          if [ -n "$TOP_TAG" ] && [ "$TOP_TAG" != "$VSN" ]; then
            echo "{{.BLUE}}live:update: retargeting appup.exs $TOP_TAG -> $VSN{{.RESET}}"
            sed -i "s/^  ~c\"$TOP_TAG\",$/  ~c\"$VSN\",/" appup.exs
          fi
          mix castle.appup.gen --from "tar:$FROM_TAR" || { echo "{{.RED}}live:update: appup gen failed for $FROM_TAR{{.RESET}}" >&2; exit 1; }
          stamp "appup edge drafted"
          if ! mix castle.appup --from "tar:$FROM_TAR" >/dev/null 2>&1; then
            echo "{{.RED}}live:update: appup coverage check failed for $FROM_TAR{{.RESET}}" >&2
            mix castle.appup --from "tar:$FROM_TAR" || true
            echo "{{.YELLOW}}change needs manual review (migration, state-shape change, or restart_emulator?){{.RESET}}"
            echo "{{.YELLOW}}hot upgrade impossible: revert the bump with 'git checkout -- mix.exs appup.exs',{{.RESET}}"
            echo "{{.YELLOW}}commit the code, and restart instead: task stop + task start{{.RESET}}"
            exit 1
          fi
          stamp "appup coverage verified"
          if [ -n "$(git status --porcelain)" ]; then
            echo "{{.GREEN}}live:update: prepared $VSN (tree now holds the bump + edge) — commit mix.exs + appup.exs,{{.RESET}}"
            echo "{{.GREEN}}then re-run task live:update; the upgrade itself runs only on a clean tree{{.RESET}}"
            exit 0
          fi
          echo "{{.BLUE}}live:update: bump + edge already committed — building prod release $VSN{{.RESET}}"
          stage_release
        fi
        RUN_VSN=$("$BIN" version 2>/dev/null | awk '{print $NF}' || true)
        if [ -n "$RUN_VSN" ] && [ "$RUN_VSN" != "$FROM_VER" ] && [ "$RUN_VSN" != "$VSN" ]; then
          echo "{{.RED}}live:update: prod runs $RUN_VSN but the relup spans $FROM_VER -> $VSN{{.RESET}}" >&2
          echo "{{.RED}}step through $FROM_VER first, or restart: task stop + task start{{.RESET}}" >&2
          exit 1
        fi
        echo "{{.GREEN}}live:update: hot-upgrading to $VSN{{.RESET}}"
        cp "releases/marketmailer-$VSN.tar.gz" "_build/prod/rel/marketmailer/releases/"
        "$CASTLE" unpack "$VSN" && "$CASTLE" install "$VSN" && "$CASTLE" commit || (
          echo "{{.RED}}live:update: hot-upgrade failed (restart_emulator upgrades exit the emulator — run task start){{.RESET}}" >&2
          exit 1
        )
        stamp "hot-upgrade installed"
        ensure_up || exit 1
        echo "{{.GREEN}}live:update: now on $VSN (tree clean; nothing left to commit){{.RESET}}"

  dev:
    desc: Interactive shell with the app started (isolated DB/port; coexists with prod)
    output: interleaved
    cmds:
      - |
        DEV_DB="${MARKETMAILER_DEV_DB:-priv/data/dev.db}"
        DEV_PORT="${DASHBOARD_PORT:-4001}"
        if [ "$DEV_DB" = "{{.DEV_DB}}" ] && [ -x {{.BIN}} ] && {{.BIN}} pid >/dev/null 2>&1; then
          echo "{{.RED}}dev: refusing: $DEV_DB is the live prod file held by the daemon — run plain \`task dev\` or \`task stop\` first{{.RESET}}" >&2
          exit 1
        fi
        mkdir -p "$(dirname "$DEV_DB")" logs
        command -v sqlite3 >/dev/null 2>&1 && [ -f "$DEV_DB" ] && [ "$(sqlite3 "$DEV_DB" 'SELECT COUNT(*) FROM regions' 2>/dev/null || echo 0)" = "0" ] && echo "{{.YELLOW}}dev: warning: no SDE regions in $DEV_DB — pollers will not start (run mix sde.import, then re-run task dev){{.RESET}}"
        MARKETMAILER_DB="$DEV_DB" DASHBOARD_PORT="$DEV_PORT" DISCORD_TOKEN="${DEV_DISCORD_TOKEN:-}" ERL_CRASH_DUMP="$PWD/logs/dev_erl_crash.dump" iex -S mix run
    interactive: true

  compile:
    desc: Compile the project
    cmds:
      - mix compile

  compile:strict:
    desc: Compile with warnings as errors
    cmds:
      - mix compile --warnings-as-errors

  format:
    desc: Check formatting (does not write)
    cmds:
      - mix format

  format:write:
    desc: Write formatting in place
    cmds:
      - mix format --no-check-formatted

  migrate:
    desc: Run pending Ecto migrations
    cmds:
      - mix ecto.migrate

  rollback:
    desc: Roll back the last Ecto migration
    cmds:
      - mix ecto.rollback

  chartdb:
    desc: Rebuild assets/schema.svg from migrations (temp DB; live poller untouched) + ensure README embed
    cmds:
      - mix chartdb

  test:
    desc: Run the test suite (safe alongside live poller when DB-isolated)
    cmds:
      - mix test

  release:
    desc: Assemble the prod OTP release with Castle hot-upgrade support
    cmds:
      - MIX_ENV=prod mix release

  update:hex:
    desc: Update Hex and Rebar themselves (mix local.hex)
    cmds:
      - mix local.hex --force
      - mix local.rebar --force

  docker:build:
    desc: Build the marketmailer Docker image
    cmds:
      - docker build -t marketmailer .

  docker:run:
    desc: Run the marketmailer Docker image (database stays in ./priv/data)
    cmds:
      - mkdir -p priv/data
      - docker run --rm -p 443:443 -p 4000:4000 -v ./priv/data:/data -e MARKETMAILER_DB=/data/marketmailer.db marketmailer

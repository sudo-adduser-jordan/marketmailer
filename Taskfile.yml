version: "3"

dotenv: [".env"]

silent: true

vars:
  DEV_DB: priv/data/marketmailer.db
  BIN: _build/prod/rel/marketmailer/bin/marketmailer
  CASTLE: _build/prod/rel/marketmailer/bin/castle

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  setup:
    desc: Install deps, migrate the DB and load the SDE name/system caches (idempotent; SDE_BUILD pins a build, default is the latest published)
    deps: [playwright:install]
    cmds:
      - |
        SDE_DB="${MARKETMAILER_DB:-{{.DEV_DB}}}"
        MARKETMAILER_DB="$SDE_DB" MARKETMAILER_DEV_DB="$SDE_DB" mix setup
        if [ -n "${SDE_BUILD:-}" ]; then
          MARKETMAILER_DB="$SDE_DB" MARKETMAILER_DEV_DB="$SDE_DB" mix sde.import "$SDE_BUILD"
        else
          MARKETMAILER_DB="$SDE_DB" MARKETMAILER_DEV_DB="$SDE_DB" mix sde.import
        fi

  playwright:install:
    desc: Install the Chromium build matching the `playwright` CLI on PATH (no-op when current)
    cmds:
      - playwright install chromium

  start:
    desc: Kill every marketmailer process, rebuild the current tree, and start it detached
    cmds:
      - |
        DEV_DB="{{.DEV_DB}}"
        PROD_DB="${MARKETMAILER_DB:-$DEV_DB}"
        EFF_DB="$DEV_DB"
        if [ -f "$PROD_DB" ]; then EFF_DB="$PROD_DB"; fi
        if [ "$PROD_DB" != "$DEV_DB" ] && [ ! -f "$PROD_DB" ] && [ -f "$DEV_DB" ]; then
          if ! mkdir -p "$(dirname "$PROD_DB")" 2>/dev/null || [ ! -w "$(dirname "$PROD_DB")" ]; then
            echo "start: cannot write prod DB dir $(dirname "$PROD_DB") — unset MARKETMAILER_DB to use $DEV_DB, or point it at a writable path"
            exit 1
          fi
        fi
        if ! command -v sqlite3 >/dev/null 2>&1; then
          echo "start: sqlite3 CLI not found — cannot verify SDE load"
          exit 1
        fi
        if [ ! -f "$EFF_DB" ]; then
          echo "start: $EFF_DB missing — run task setup first (migrate + SDE load)"
          exit 1
        fi
        SDE_OK=1
        for q in "SELECT COUNT(*) FROM sde_imports" "SELECT COUNT(*) FROM names" "SELECT COUNT(*) FROM systems" "SELECT COUNT(*) FROM regions"; do
          n=$(sqlite3 "$EFF_DB" "$q" 2>/dev/null) || SDE_OK=0
          if [ -z "$n" ] || [ "$n" = "0" ]; then SDE_OK=0; fi
        done
        if [ "$SDE_OK" != "1" ]; then
          echo "start: SDE not loaded in $EFF_DB (sde_imports/names/systems/regions empty or missing) — run task setup first"
          if [ "$EFF_DB" = "$PROD_DB" ] && [ "$PROD_DB" != "$DEV_DB" ]; then
            echo "start: note: setup loads $DEV_DB; a stale prod file keeps failing — load it directly: MARKETMAILER_DB=\"$PROD_DB\" mix sde.import${SDE_BUILD:+ \"$SDE_BUILD\"}"
          fi
          exit 1
        fi
        echo "start: SDE caches present in $EFF_DB"
      - task: stop
      # Force-recompile so build-time macros (e.g. the git commit baked into
      # logs) are always fresh: `mix release` alone reuses stale beams.
      - MIX_ENV=prod mix compile --force
      - MIX_ENV=prod mix release --overwrite
      - |
        DEV_DB="{{.DEV_DB}}"
        PROD_DB="${MARKETMAILER_DB:-$DEV_DB}"
        if [ "$PROD_DB" != "$DEV_DB" ] && [ ! -f "$PROD_DB" ] && [ -f "$DEV_DB" ]; then
          for suffix in "" "-wal" "-shm"; do
            if [ -f "$DEV_DB$suffix" ]; then
              cp "$DEV_DB$suffix" "$PROD_DB$suffix"
            fi
          done
          echo "start: seeded $PROD_DB from $DEV_DB"
        fi
      - |
        PROD_DB="$(realpath -m "${MARKETMAILER_DB:-{{.DEV_DB}}}")"
        rm -f priv/data/marketmailer.pid
        mkdir -p logs
        MARKETMAILER_DB="$PROD_DB" ERL_CRASH_DUMP="$PWD/logs/erl_crash.dump" RUN_ERL_LOG_MAXSIZE=10485760 {{.BIN}} daemon
        echo "started prod release (daemon, database $PROD_DB)"

  stop:
    desc: Kill every marketmailer process on this host
    cmds:
      - |
        BIN={{.BIN}}
        ROOT="$PWD/_build"
        if [ -x "$BIN" ] && "$BIN" pid >/dev/null 2>&1; then
          LIVE=$("$BIN" pid 2>/dev/null || echo unknown)
          "$BIN" stop >/dev/null 2>&1 || true
          echo "stop: asked prod release to stop (was pid $LIVE)"
        fi
        targets() {
          pgrep -f "$ROOT/prod/rel/marketmailer/.*/(beam\.smp|run_erl|erl|inet_gethost)" 2>/dev/null || true
          pgrep -f "$ROOT/dev/" 2>/dev/null || true
        }
        pids=$(targets | sort -u)
        if [ -n "$pids" ]; then
          echo "stop: terminating leftovers: $(echo $pids | tr '\n' ' ')"
          kill $pids 2>/dev/null || true
          for _ in $(seq 1 20); do
            pids=$(targets | sort -u)
            [ -z "$pids" ] && break
            sleep 0.5
          done
          pids=$(targets | sort -u)
          if [ -n "$pids" ]; then
            echo "stop: killing stubborn leftovers: $(echo $pids | tr '\n' ' ')"
            kill -9 $pids 2>/dev/null || true
          fi
        fi
        rm -f priv/data/marketmailer.pid

  live:update:
    desc: Hot-upgrade the running prod in two phases (prepare writes bump+appup, you commit, re-run applies on a clean tree); refuses when nothing runs or the tree is dirty, and never leaves the daemon down
    cmds:
      - |
        VSN=$(sed -n 's/^[[:space:]]*version:[[:space:]]*"\(.*\)".*/\1/p' mix.exs | head -n 1)
        test -n "$VSN" || (echo "could not read version from mix.exs" && exit 1)
        BIN={{.BIN}}
        CASTLE={{.CASTLE}}
        ALL_TARS=$(ls releases/marketmailer-*.tar.gz 2>/dev/null | sort -V || true)
        T0=$SECONDS
        stamp() { echo "live:update: [$((SECONDS - T0))s] $1"; }
        DIRTY=$(git status --porcelain || true)
        if ! { [ -x "$BIN" ] && "$BIN" pid >/dev/null 2>&1; }; then
          echo "live:update: no living prod process to update — run task start"
          exit 1
        fi
        if [ -n "$DIRTY" ]; then
          echo "live:update: uncommitted changes — commit everything first:"
          echo "$DIRTY" | head -n 20
          exit 1
        fi
        ensure_up() {
          up() {
            "$BIN" pid >/dev/null 2>&1 || return 1
            "$BIN" rpc 'IO.puts(Process.whereis(Marketmailer.Supervisor) != nil)' 2>/dev/null | grep -q '^true$'
          }
          live=0
          for _ in $(seq 1 30); do
            if up; then live=1; break; fi
            sleep 1
          done
          if [ "$live" != "1" ]; then
            echo "live:update: daemon is down — restarting on $VSN"
            task stop >/dev/null 2>&1 || true
            "$BIN" daemon || { echo "live:update: could not restart the daemon — run task start"; return 1; }
            live=0
            for _ in $(seq 1 30); do
              if up; then live=1; break; fi
              sleep 1
            done
          fi
          if [ "$live" != "1" ]; then
            echo "live:update: daemon did not come back up — run task start"
            return 1
          fi
          RUN_NOW=$("$BIN" version 2>/dev/null | awk '{print $NF}')
          if [ "$RUN_NOW" != "$VSN" ]; then
            echo "live:update: daemon is up on $RUN_NOW, expected $VSN — run task start"
            return 1
          fi
          return 0
        }
        stage_release() {
          # Force-recompile so build-time macros (e.g. the git commit baked
          # into logs) are always fresh: `mix release` alone reuses stale beams.
          MIX_ENV=prod mix compile --force
          stamp "prod recompile done"
          MIX_ENV=prod mix release --overwrite
          stamp "prod release assembled"
          mkdir -p releases
          cp "_build/prod/marketmailer-$VSN.tar.gz" releases/
          echo "live:update: staged releases/marketmailer-$VSN.tar.gz"
        }
        if [ -z "$ALL_TARS" ]; then
          echo "live:update: no shipped baseline — first build, no upgrade path"
          stage_release
          ensure_up || exit 1
          exit 0
        fi
        FROM_TAR=""
        for tar in $ALL_TARS; do
          ver=$(basename "$tar" .tar.gz | sed 's/^marketmailer-//')
          if [ "$ver" != "$VSN" ] && [ "$(printf '%s\n%s\n' "$ver" "$VSN" | sort -V | head -n 1)" = "$ver" ]; then
            FROM_TAR="$tar"
          fi
        done
        if [ -z "$FROM_TAR" ]; then
          NEWEST_TAR=$(echo "$ALL_TARS" | tail -n 1)
          NEWEST_VER=$(basename "$NEWEST_TAR" .tar.gz | sed 's/^marketmailer-//')
          if [ "$NEWEST_VER" = "$VSN" ]; then
            FROM_TAR="$NEWEST_TAR"
          else
            echo "live:update: no baseline older than $VSN — building without upgrade path"
            stage_release
            ensure_up || exit 1
            exit 0
          fi
        fi
        FROM_VER=$(basename "$FROM_TAR" .tar.gz | sed 's/^marketmailer-//')
        mix compile >/dev/null 2>&1 || (echo "live:update: compile failed" && exit 1)
        stamp "dev compile ok"
        if mix castle.appup --from "tar:$FROM_TAR" >/dev/null 2>&1; then
          stamp "appup coverage holds for $FROM_VER -> $VSN"
          if [ ! -f "releases/marketmailer-$VSN.tar.gz" ]; then
            echo "live:update: version $VSN not built yet — building (no version change needed)"
            stage_release
          else
            RUN_VSN=$("$BIN" version 2>/dev/null | awk '{print $NF}' || true)
            if [ "$RUN_VSN" = "$VSN" ]; then
              echo "live:update: no changes (version $VSN matches $FROM_TAR) — nothing to do"
              ensure_up || exit 1
              exit 0
            fi
            echo "live:update: $VSN staged but daemon runs ${RUN_VSN:-unknown} — resuming upgrade"
          fi
        else
          echo "live:update: code differs from $FROM_TAR"
          if [ -f "releases/marketmailer-$VSN.tar.gz" ]; then
            NEW_VSN=$(echo "$VSN" | awk -F. '{printf "%s.%s.%d", $1, $2, $3+1}')
            case "$NEW_VSN" in
              *.*.*) ;;
              *) echo "live:update: cannot bump version '$VSN'" && exit 1 ;;
            esac
            echo "live:update: $VSN already shipped — bumping mix.exs to $NEW_VSN"
            sed -i "s/^\([[:space:]]*version:[[:space:]]*\)\".*\"/\1\"$NEW_VSN\"/" mix.exs
            VSN="$NEW_VSN"
          fi
          FROM_TAR=$(ls releases/marketmailer-*.tar.gz 2>/dev/null | sort -V | tail -n 1)
          FROM_VER=$(basename "$FROM_TAR" .tar.gz | sed 's/^marketmailer-//')
          TOP_TAG=$(sed -n 's/^  ~c"\(.*\)",$/\1/p' appup.exs | head -n 1)
          if [ -n "$TOP_TAG" ] && [ "$TOP_TAG" != "$VSN" ]; then
            echo "live:update: retargeting appup.exs $TOP_TAG -> $VSN"
            sed -i "s/^  ~c\"$TOP_TAG\",$/  ~c\"$VSN\",/" appup.exs
          fi
          mix castle.appup.gen --from "tar:$FROM_TAR" || (echo "live:update: appup gen failed for $FROM_TAR" && exit 1)
          stamp "appup edge drafted"
          if ! mix castle.appup --from "tar:$FROM_TAR" >/dev/null 2>&1; then
            echo "live:update: appup coverage check failed for $FROM_TAR"
            mix castle.appup --from "tar:$FROM_TAR" || true
            echo "change needs manual review (migration, state-shape change, or restart_emulator?)"
            echo "hot upgrade impossible: revert the bump with 'git checkout -- mix.exs appup.exs',"
            echo "commit the code, and restart instead: task stop + task start"
            exit 1
          fi
          stamp "appup coverage verified"
          if [ -n "$(git status --porcelain)" ]; then
            echo "live:update: prepared $VSN (tree now holds the bump + edge) — commit mix.exs + appup.exs,"
            echo "then re-run task live:update; the upgrade itself runs only on a clean tree"
            exit 0
          fi
          echo "live:update: bump + edge already committed — building prod release $VSN"
          stage_release
        fi
        RUN_VSN=$("$BIN" version 2>/dev/null | awk '{print $NF}' || true)
        if [ -n "$RUN_VSN" ] && [ "$RUN_VSN" != "$FROM_VER" ] && [ "$RUN_VSN" != "$VSN" ]; then
          echo "live:update: prod runs $RUN_VSN but the relup spans $FROM_VER -> $VSN"
          echo "step through $FROM_VER first, or restart: task stop + task start"
          exit 1
        fi
        echo "live:update: hot-upgrading to $VSN"
        cp "releases/marketmailer-$VSN.tar.gz" "_build/prod/rel/marketmailer/releases/"
        "$CASTLE" unpack "$VSN" && "$CASTLE" install "$VSN" && "$CASTLE" commit || (
          echo "live:update: hot-upgrade failed (restart_emulator upgrades exit the emulator — run task start)"
          exit 1
        )
        stamp "hot-upgrade installed"
        ensure_up || exit 1
        echo "live:update: now on $VSN (tree clean; nothing left to commit)"

  dev:
    desc: Interactive shell with the app started (isolated DB/port; coexists with prod)
    cmds:
      - |
        DEV_DB="${MARKETMAILER_DEV_DB:-priv/data/dev.db}"
        DEV_PORT="${DASHBOARD_PORT:-4001}"
        BIN={{.BIN}}
        if [ "$DEV_DB" = "{{.DEV_DB}}" ] && [ -x "$BIN" ] && "$BIN" pid >/dev/null 2>&1; then
          echo "dev: refusing: $DEV_DB is the live prod file held by the daemon (see \`ps aux | grep -F marketmailer\`)"
          echo "dev: run plain \`task dev\` for the isolated priv/data/dev.db, or \`task stop\` first"
          exit 1
        fi
        mkdir -p "$(dirname "$DEV_DB")"
        mkdir -p logs
        if command -v sqlite3 >/dev/null 2>&1 && [ -f "$DEV_DB" ]; then
          if [ "$(sqlite3 "$DEV_DB" 'SELECT COUNT(*) FROM regions' 2>/dev/null || echo 0)" = "0" ]; then
            echo "dev: warning: no SDE regions in $DEV_DB — market pollers will not start (regions_missing)"
            echo "dev: load them with \`mix sde.import\` (dev targets priv/data/dev.db), then re-run task dev"
          fi
        fi
        MARKETMAILER_DB="$DEV_DB" DASHBOARD_PORT="$DEV_PORT" DISCORD_TOKEN="${DEV_DISCORD_TOKEN:-}" ERL_CRASH_DUMP="$PWD/logs/dev_erl_crash.dump" iex -S mix run
    interactive: true

  compile:
    desc: Compile the project
    cmds:
      - mix compile

  compile:strict:
    desc: Compile with warnings as errors
    cmds:
      - mix compile --warnings-as-errors

  format:
    desc: Check formatting (does not write)
    cmds:
      - mix format

  format:write:
    desc: Write formatting in place
    cmds:
      - mix format --no-check-formatted

  migrate:
    desc: Run pending Ecto migrations
    cmds:
      - mix ecto.migrate

  rollback:
    desc: Roll back the last Ecto migration
    cmds:
      - mix ecto.rollback

  chartdb:
    desc: Rebuild assets/schema.svg from migrations (temp DB; live poller untouched) + ensure README embed
    cmds:
      - mix chartdb

  test:
    desc: Run the test suite (safe alongside live poller when DB-isolated)
    cmds:
      - mix test

  release:
    desc: Assemble the prod OTP release with Castle hot-upgrade support
    cmds:
      - MIX_ENV=prod mix release

  update:
    desc: Update all dependencies to latest allowed versions (mix deps.update --all)
    cmds:
      - mix deps.update --all

  update:hex:
    desc: Update Hex and Rebar themselves (mix local.hex)
    cmds:
      - mix local.hex --force
      - mix local.rebar --force

  docker:build:
    desc: Build the marketmailer Docker image
    cmds:
      - docker build -t marketmailer .

  docker:run:
    desc: Run the marketmailer Docker image (database stays in ./priv/data)
    cmds:
      - mkdir -p priv/data
      - docker run --rm -p 443:443 -p 4000:4000 -v ./priv/data:/data -e MARKETMAILER_DB=/data/marketmailer.db marketmailer

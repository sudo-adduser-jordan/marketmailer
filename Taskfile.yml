version: "3"

dotenv: [".env"]

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  setup:
    desc: Install deps and set up the database (deps.get + ecto.create + ecto.migrate)
    cmds:
      - mix setup

  start:
    desc: Run latest tree as prod release detached (restarts when stale; never modifies the repo)
    status:
      - |
        # Up-to-date iff the daemon runs a release built from this exact tree.
        # The stamp is written on every start-launch under _build (gitignored),
        # so this check never dirties the repo.
        STAMP=_build/prod/.start_stamp
        test -f "$STAMP" || exit 1
        FPRINT="$(git rev-parse HEAD 2>/dev/null || echo no-git):$(git status --porcelain 2>/dev/null | sha256sum | cut -d' ' -f1)"
        test "$(cat "$STAMP")" = "$FPRINT" || exit 1
        # NOTE: `pgrep -f` scans full command lines, and this script's own
        # text contains the pattern — as does every go-task wrapper shell
        # above us — so exclude this shell AND all its ancestors. A bare
        # `pgrep -f "[m]arketmailer"` (or filtering only $$) always matches
        # itself and is useless here.
        drop="^$$\$"
        _p=$PPID
        while [ -n "$_p" ] && [ "$_p" != "1" ]; do
          drop="$drop|^${_p}\$"
          _p=$(ps -o ppid= -p "$_p" 2>/dev/null | tr -d '[:space:]') || break
        done
        if pgrep -f "prod/rel/marketmailer" | grep -Ev "$drop" > /dev/null; then
          echo "prod release already running current code — nothing to do"
        else
          exit 1
        fi
    cmds:
      - task: stop
      - MIX_ENV=prod mix release --overwrite
      - |
        # Seed a fresh prod DB from the in-project DB so the first boot
        # reuses warm etags/market cache instead of resweeping all of ESI.
        # Only when prod has no DB yet and the paths differ (single-host
        # setups share one file, so this is a no-op there). The daemon is
        # stopped above, so plain cp is safe (copy -wal/-shm sidecars too
        # when present — the WAL may hold committed data).
        DEV_DB="priv/data/marketmailer.db"
        PROD_DB="${MARKETMAILER_DB:-/data/marketmailer.db}"
        if [ "$PROD_DB" != "$DEV_DB" ] && [ ! -f "$PROD_DB" ] && [ -f "$DEV_DB" ]; then
          if ! mkdir -p "$(dirname "$PROD_DB")" 2>/dev/null || [ ! -w "$(dirname "$PROD_DB")" ]; then
            echo "start: cannot write prod DB dir $(dirname "$PROD_DB") — set MARKETMAILER_DB to a writable path in .env (e.g. priv/data/marketmailer.db)"
            exit 1
          fi
          for suffix in "" "-wal" "-shm"; do
            if [ -f "$DEV_DB$suffix" ]; then
              cp "$DEV_DB$suffix" "$PROD_DB$suffix"
            fi
          done
          echo "start: seeded $PROD_DB from $DEV_DB"
        fi
      - |
        # Stale pidfile from the removed detached-dev workflow (dev is now
        # shell-only via `task dev`); the release daemon never uses it.
        rm -f priv/data/marketmailer.pid
        _build/prod/rel/marketmailer/bin/marketmailer daemon
        echo "started prod release (daemon)"
        # Record the tree this release was built from (see `status` above).
        mkdir -p _build/prod
        echo "$(git rev-parse HEAD 2>/dev/null || echo no-git):$(git status --porcelain 2>/dev/null | sha256sum | cut -d' ' -f1)" > _build/prod/.start_stamp

  stop:
    desc: Stop everything (prod daemon + any legacy dev node)
    cmds:
      - |
        # See `start` for why this shell and all its ancestors must be
        # excluded from pgrep -f results.
        drop="^$$\$"
        _p=$PPID
        while [ -n "$_p" ] && [ "$_p" != "1" ]; do
          drop="$drop|^${_p}\$"
          _p=$(ps -o ppid= -p "$_p" 2>/dev/null | tr -d '[:space:]') || break
        done
        # Prod daemon first (graceful via its own script).
        LIVE=$(pgrep -f "prod/rel/marketmailer" | grep -Ev "$drop" | head -n 1 || true)
        if [ -n "$LIVE" ]; then
          BIN=_build/prod/rel/marketmailer/bin/marketmailer
          if [ -x "$BIN" ]; then
            "$BIN" stop
          else
            /bin/kill "$LIVE"
          fi
          echo "stopped prod release (was pid $LIVE)"
        else
          echo "prod release not running — nothing to do"
        fi
        # Legacy detached-dev poller (removed workflow: elixir --sname
        # marketmailer -S mix run). `task dev` shells carry no --sname in
        # their command line, so they never match; release beams are
        # excluded by the prod/rel filter (already stopped above).
        for DEV in $(pgrep -f "sname marketmailer" | grep -Ev "$drop" | grep -Ev "prod/rel/marketmailer" || true); do
          /bin/kill "$DEV" && echo "stopped legacy dev poller pid $DEV"
        done
        # Stale pidfile from the removed detached-dev workflow.
        rm -f priv/data/marketmailer.pid

  live:update:
    desc: Hot-upgrade prod when code changed (auto patch-bump, appup, build, unpack/install/commit); no-op otherwise
    cmds:
      - |
        VSN=$(sed -n 's/^[[:space:]]*version:[[:space:]]*"\(.*\)".*/\1/p' mix.exs | head -n 1)
        test -n "$VSN" || (echo "could not read version from mix.exs" && exit 1)
        BIN=_build/prod/rel/marketmailer/bin/marketmailer
        CASTLE=_build/prod/rel/marketmailer/bin/castle
        # Shipped baselines (local staging, gitignored). Linear deploys
        # upgrade from the newest tarball older than the version being
        # built; that single baseline gets the appup edge and the relup.
        ALL_TARS=$(ls artifacts/marketmailer-*.tar.gz 2>/dev/null | sort -V || true)
        DIRTY=$(git status --porcelain || true)
        if [ -z "$ALL_TARS" ]; then
          echo "live:update: no shipped baseline — first build, no upgrade path"
          MIX_ENV=prod mix release --overwrite
          mkdir -p artifacts
          cp "_build/prod/marketmailer-$VSN.tar.gz" artifacts/
          echo "live:update: staged artifacts/marketmailer-$VSN.tar.gz — run task start to launch it"
          exit 0
        fi
        FROM_TAR=""
        for tar in $ALL_TARS; do
          ver=$(basename "$tar" .tar.gz | sed 's/^marketmailer-//')
          if [ "$ver" != "$VSN" ] && [ "$(printf '%s\n%s\n' "$ver" "$VSN" | sort -V | head -n 1)" = "$ver" ]; then
            FROM_TAR="$tar"
          fi
        done
        if [ -z "$FROM_TAR" ]; then
          echo "live:update: no baseline older than $VSN — building without upgrade path"
          MIX_ENV=prod mix release --overwrite
          mkdir -p artifacts
          cp "_build/prod/marketmailer-$VSN.tar.gz" artifacts/
          echo "live:update: staged artifacts/marketmailer-$VSN.tar.gz"
          exit 0
        fi
        FROM_VER=$(basename "$FROM_TAR" .tar.gz | sed 's/^marketmailer-//')
        mix compile >/dev/null 2>&1 || (echo "live:update: compile failed" && exit 1)
        if mix castle.appup --from "tar:$FROM_TAR" >/dev/null 2>&1; then
          if [ ! -f "artifacts/marketmailer-$VSN.tar.gz" ]; then
            echo "live:update: version $VSN not built yet — building (no version change needed)"
            echo "live:update: building prod release $VSN"
            MIX_ENV=prod mix release --overwrite
            mkdir -p artifacts
            cp "_build/prod/marketmailer-$VSN.tar.gz" artifacts/
            echo "live:update: staged artifacts/marketmailer-$VSN.tar.gz"
          else
            if [ -n "$DIRTY" ]; then
              echo "live:update: non-code changes only — no hot-upgrade needed"
              echo "(release config applies at boot: task stop + task start; docs need nothing)"
            else
              echo "live:update: no changes (version $VSN matches $FROM_TAR) — nothing to do"
            fi
            exit 0
          fi
        else
          echo "live:update: code differs from $FROM_TAR"
          # A version whose tarball already shipped is frozen: bump patch so
          # the relup has a from->to transition (same-version upgrades can
          # never install).
          if [ -f "artifacts/marketmailer-$VSN.tar.gz" ]; then
            NEW_VSN=$(echo "$VSN" | awk -F. '{printf "%s.%s.%d", $1, $2, $3+1}')
            case "$NEW_VSN" in
              *.*.*) ;;
              *) echo "live:update: cannot bump version '$VSN'" && exit 1 ;;
            esac
            echo "live:update: $VSN already shipped — bumping mix.exs to $NEW_VSN"
            sed -i "s/^\([[:space:]]*version:[[:space:]]*\)\".*\"/\1\"$NEW_VSN\"/" mix.exs
            VSN="$NEW_VSN"
          fi
          # Newest tarball older than the (possibly bumped) version.
          FROM_TAR=$(ls artifacts/marketmailer-*.tar.gz 2>/dev/null | sort -V | tail -n 1)
          FROM_VER=$(basename "$FROM_TAR" .tar.gz | sed 's/^marketmailer-//')
          # gen drafts edges under the file's top-level tag, which must name
          # the version being built (mix release refuses anything else).
          TOP_TAG=$(sed -n 's/^  ~c"\(.*\)",$/\1/p' appup.exs | head -n 1)
          if [ -n "$TOP_TAG" ] && [ "$TOP_TAG" != "$VSN" ]; then
            echo "live:update: retargeting appup.exs $TOP_TAG -> $VSN"
            sed -i "s/^  ~c\"$TOP_TAG\",$/  ~c\"$VSN\",/" appup.exs
          fi
          mix castle.appup.gen --from "tar:$FROM_TAR" || (echo "live:update: appup gen failed for $FROM_TAR" && exit 1)
          if ! mix castle.appup --from "tar:$FROM_TAR" >/dev/null 2>&1; then
            echo "live:update: appup coverage check failed for $FROM_TAR"
            mix castle.appup --from "tar:$FROM_TAR" || true
            echo "change needs manual review (migration, state-shape change, or restart_emulator?)"
            echo "commit mix.exs + appup.exs and restart instead: task stop + task start"
            exit 1
          fi
          echo "live:update: building prod release $VSN"
          MIX_ENV=prod mix release --overwrite
          mkdir -p artifacts
          cp "_build/prod/marketmailer-$VSN.tar.gz" artifacts/
          echo "live:update: staged artifacts/marketmailer-$VSN.tar.gz"
        fi
        # See `start` for why this shell and all its ancestors must be
        # excluded from pgrep -f results.
        drop="^$$\$"
        _p=$PPID
        while [ -n "$_p" ] && [ "$_p" != "1" ]; do
          drop="$drop|^${_p}\$"
          _p=$(ps -o ppid= -p "$_p" 2>/dev/null | tr -d '[:space:]') || break
        done
        if ! pgrep -f "prod/rel/marketmailer" | grep -Ev "$drop" > /dev/null; then
          echo "live:update: prod release not running — built $VSN, run task start to launch it"
          echo "live:update: remember to commit mix.exs + appup.exs"
          exit 0
        fi
        # The relup only spans FROM_VER -> VSN: refuse to install onto a node
        # that skipped the baseline instead of failing opaquely in castle.
        RUN_VSN=$("$BIN" version 2>/dev/null | awk '{print $NF}' || true)
        if [ -n "$RUN_VSN" ] && [ "$RUN_VSN" != "$FROM_VER" ] && [ "$RUN_VSN" != "$VSN" ]; then
          echo "live:update: prod runs $RUN_VSN but the relup spans $FROM_VER -> $VSN"
          echo "step through $FROM_VER first, or restart: task stop + task start"
          exit 1
        fi
        echo "live:update: hot-upgrading to $VSN"
        # castle unpack reads the tarball from the release's own releases/
        # dir, but `mix release` leaves it at _build/prod/. Stage it over
        # (this path mismatch is what used to fail unpack with :no_such_file).
        cp "artifacts/marketmailer-$VSN.tar.gz" "_build/prod/rel/marketmailer/releases/"
        "$CASTLE" unpack "$VSN" && "$CASTLE" install "$VSN" && "$CASTLE" commit || (
          echo "live:update: hot-upgrade failed (restart_emulator upgrades exit the emulator — run task start)"
          exit 1
        )
        echo "live:update: now on $VSN — remember to commit mix.exs + appup.exs"

  dev:
    desc: Interactive shell with the app started
    cmds:
      - iex -S mix run
    interactive: true

  compile:
    desc: Compile the project
    cmds:
      - mix compile

  compile:strict:
    desc: Compile with warnings as errors
    cmds:
      - mix compile --warnings-as-errors

  format:
    desc: Check formatting (does not write)
    cmds:
      - mix format

  format:write:
    desc: Write formatting in place
    cmds:
      - mix format --no-check-formatted

  migrate:
    desc: Run pending Ecto migrations
    cmds:
      - mix ecto.migrate

  rollback:
    desc: Roll back the last Ecto migration
    cmds:
      - mix ecto.rollback

  chartdb:
    desc: Rebuild assets/schema.svg from migrations (temp DB; live poller untouched) + ensure README embed
    cmds:
      - mix chartdb

  test:
    desc: Run the test suite
    cmds:
      - mix test

  test:safe:
    desc: Test in MIX_ENV=test alongside a live poller when DB-isolated (stubbed ESI, priv/data/test.db)
    cmds:
      - mix test.safe

  release:
    desc: Assemble the prod OTP release with Castle hot-upgrade support
    cmds:
      - MIX_ENV=prod mix release

  update:
    desc: Update all dependencies to latest allowed versions (mix deps.update --all)
    cmds:
      - mix deps.update --all

  update:hex:
    desc: Update Hex and Rebar themselves (mix local.hex)
    cmds:
      - mix local.hex --force
      - mix local.rebar --force

  docker:build:
    desc: Build the marketmailer Docker image
    cmds:
      - docker build -t marketmailer .

  docker:run:
    desc: Run the marketmailer Docker image (database stays in ./priv/data)
    cmds:
      - mkdir -p priv/data
      - docker run --rm -p 443:443 -v ./priv/data:/data -e MARKETMAILER_DB=/data/marketmailer.db marketmailer

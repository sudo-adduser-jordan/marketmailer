version: "3"

dotenv: [".env"]

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  setup:
    desc: Install deps and set up the database (deps.get + ecto.create + ecto.migrate)
    cmds:
      - mix setup

  start:
    desc: Set up and run the app (blocks)
    cmds:
      - mix start

  dev:
    desc: Interactive shell with the app started
    cmds:
      - iex -S mix run
    interactive: true

  compile:
    desc: Compile the project
    cmds:
      - mix compile

  compile:strict:
    desc: Compile with warnings as errors
    cmds:
      - mix compile --warnings-as-errors

  format:
    desc: Check formatting (does not write)
    cmds:
      - mix format

  format:write:
    desc: Write formatting in place
    cmds:
      - mix format --no-check-formatted

  migrate:
    desc: Run pending Ecto migrations
    cmds:
      - mix ecto.migrate

  rollback:
    desc: Roll back the last Ecto migration
    cmds:
      - mix ecto.rollback

  test:
    desc: Run the test suite
    cmds:
      - mix test

  test:safe:
    desc: Refuse if a live poller runs, then test in MIX_ENV=test (stubbed ESI, isolated test.db)
    cmds:
      - mix test.safe

  upgrade:dev:
    desc: Compile and hot-load beams into the live node (no restart; state-shape changes need a poller restart)
    cmds:
      - mix upgrade.hot

  upgrade:test:
    desc: Recompile and run the isolated test suite (stubbed ESI, isolated test.db)
    cmds:
      - mix compile --warnings-as-errors
      - mix test.safe

  live:cookie:
    desc: Generate the shared distribution cookie (~/.config/marketmailer/cookie, mode 600; never overwrites)
    cmds:
      - mkdir -p ~/.config/marketmailer && if [ -f ~/.config/marketmailer/cookie ]; then echo "cookie already exists"; else openssl rand -hex 32 > ~/.config/marketmailer/cookie && chmod 600 ~/.config/marketmailer/cookie && echo "cookie created"; fi

  live:start:
    desc: Run the poller as a distributed node (attachable, hot-reloadable; blocks)
    cmds:
      - test -f ~/.config/marketmailer/cookie || (echo "run task live:cookie first" && exit 1)
      - elixir --sname marketmailer --cookie "$(cat ~/.config/marketmailer/cookie)" -S mix run --no-halt
    interactive: true

  live:attach:
    desc: Attach to the live node (run recompile() there to hot-load by hand)
    cmds:
      - test -f ~/.config/marketmailer/cookie || (echo "run task live:cookie first" && exit 1)
      - iex --sname debug --cookie "$(cat ~/.config/marketmailer/cookie)" --remsh marketmailer
    interactive: true

  upgrade:prod:
    desc: Restart prod (no mix release configured; safe now that etag expiry persists — zero early requests)
    cmds:
      - docker build -t marketmailer .
      - docker run --rm -p 443:443 -v marketmailer-data:/data -e MARKETMAILER_DB=/data/marketmailer.db marketmailer

  update:
    desc: Update all dependencies to latest allowed versions (mix deps.update --all)
    cmds:
      - mix deps.update --all

  update:hex:
    desc: Update Hex and Rebar themselves (mix local.hex)
    cmds:
      - mix local.hex --force
      - mix local.rebar --force

  docker:build:
    desc: Build the marketmailer Docker image
    cmds:
      - docker build -t marketmailer .

  docker:run:
    desc: Run the marketmailer Docker image (SQLite volume at marketmailer-data:/data)
    cmds:
      - docker run --rm -p 443:443 -v marketmailer-data:/data -e MARKETMAILER_DB=/data/marketmailer.db marketmailer

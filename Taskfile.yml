version: "3"

dotenv: [".env"]

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  setup:
    desc: Install deps and set up the database (deps.get + ecto.create + ecto.migrate)
    cmds:
      - mix setup

  start:
    desc: Set up and run the app (blocks)
    cmds:
      - mix start

  dev:
    desc: Interactive shell with the app started
    cmds:
      - iex -S mix run
    interactive: true

  compile:
    desc: Compile the project
    cmds:
      - mix compile

  compile:strict:
    desc: Compile with warnings as errors
    cmds:
      - mix compile --warnings-as-errors

  format:
    desc: Check formatting (does not write)
    cmds:
      - mix format

  format:write:
    desc: Write formatting in place
    cmds:
      - mix format --no-check-formatted

  migrate:
    desc: Run pending Ecto migrations
    cmds:
      - mix ecto.migrate

  rollback:
    desc: Roll back the last Ecto migration
    cmds:
      - mix ecto.rollback

  test:
    desc: Run the test suite
    cmds:
      - mix test

  test:safe:
    desc: Test in MIX_ENV=test alongside a live poller when DB-isolated (stubbed ESI, priv/data/test.db)
    cmds:
      - mix test.safe

  release:
    desc: Assemble the prod OTP release with Castle hot-upgrade support
    cmds:
      - MIX_ENV=prod mix release

  upgrade:build:
    desc: "Build the release tarball and stage it under artifacts/ for tar: baselines"
    cmds:
      - MIX_ENV=prod mix release
      - mkdir -p artifacts
      - cp _build/prod/marketmailer-*.tar.gz artifacts/
      - ls artifacts/

  upgrade:check:
    desc: "Validate appup/relup for FROM -> TO (e.g. task upgrade:check FROM=0.1.0 TO=0.1.1)"
    cmds:
      - 'test -n "{{.FROM}}" -a -n "{{.TO}}" || (echo "usage: task upgrade:check FROM=<vsn> TO=<vsn>" && exit 1)'
      - mix castle.appup --from tar:artifacts/marketmailer-{{.FROM}}.tar.gz --to rel:_build/prod/rel/marketmailer/releases/{{.TO}}/marketmailer
      - mix castle.relup --target _build/prod/rel/marketmailer/releases/{{.TO}}/marketmailer --fromto tar:artifacts/marketmailer-{{.FROM}}.tar.gz --dry-run

  upgrade:install:
    desc: Hot-upgrade the running deployment (bin/castle unpack/install/commit; needs VSN, e.g. task upgrade:install VSN=0.1.1)
    cmds:
      - 'test -n "{{.VSN}}" || (echo "usage: task upgrade:install VSN=<vsn>" && exit 1)'
      - _build/prod/rel/marketmailer/bin/castle unpack {{.VSN}}
      - _build/prod/rel/marketmailer/bin/castle install {{.VSN}}
      - _build/prod/rel/marketmailer/bin/castle commit

  upgrade:test:
    desc: Recompile and run the isolated test suite (stubbed ESI, isolated priv/data/test.db)
    cmds:
      - mix compile --warnings-as-errors
      - mix test.safe

  live:start:
    desc: Run the poller as a distributed node (attachable; blocks — upgrades via bin/castle)
    cmds:
      - elixir --sname marketmailer -S mix run --no-halt
    interactive: true

  live:start:release:
    desc: Run the prod release in the foreground (RELEASE_NODE from env; blocks)
    cmds:
      - _build/prod/rel/marketmailer/bin/marketmailer foreground
    interactive: true

  live:attach:
    desc: Attach to the live mix-run node (read-only inspection; upgrades via bin/castle, not recompile())
    cmds:
      - iex --sname debug --remsh marketmailer
    interactive: true

  live:remote:
    desc: Attach to the running release (reads the deployment cookie itself; no setup)
    cmds:
      - _build/prod/rel/marketmailer/bin/marketmailer remote
    interactive: true

  upgrade:prod:
    desc: Build the prod release image and run the Castle deployment (see Dockerfile header)
    cmds:
      - docker build -t marketmailer .
      - docker run --rm -p 443:443 -v marketmailer-data:/data -e MARKETMAILER_DB=/data/marketmailer.db marketmailer

  update:
    desc: Update all dependencies to latest allowed versions (mix deps.update --all)
    cmds:
      - mix deps.update --all

  update:hex:
    desc: Update Hex and Rebar themselves (mix local.hex)
    cmds:
      - mix local.hex --force
      - mix local.rebar --force

  docker:build:
    desc: Build the marketmailer Docker image
    cmds:
      - docker build -t marketmailer .

  docker:run:
    desc: Run the marketmailer Docker image (SQLite volume at marketmailer-data:/data)
    cmds:
      - docker run --rm -p 443:443 -v marketmailer-data:/data -e MARKETMAILER_DB=/data/marketmailer.db marketmailer
